<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1640"/>
      <stop offset="1" stop-color="#1a0d27"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8151b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8151b8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="crowd" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="8" r="4.2" fill="#ffffff" opacity="0.09"/>
      <circle cx="20" cy="18" r="3.6" fill="#ffffff" opacity="0.07"/>
      <circle cx="19" cy="5" r="2.8" fill="#cd2247" opacity="0.10"/>
      <circle cx="5" cy="21" r="2.4" fill="#bda3e0" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="180" rx="820" ry="330" fill="url(#glow)"/>

  <!-- Gradinate: fasce diagonali che salgono verso l alto -->
  <g opacity="0.9">
    <path d="M0 900 L1600 900 L1600 610 L0 700 Z" fill="#41215f"/>
    <path d="M0 700 L1600 610 L1600 470 L0 580 Z" fill="#2c1640"/>
    <path d="M0 580 L1600 470 L1600 360 L0 470 Z" fill="#41215f" opacity="0.75"/>
  </g>

  <rect y="360" width="1600" height="540" fill="url(#crowd)"/>

  <!-- Bandiere -->
  <g opacity="0.5">
    <path d="M180 640 l150 -34 v78 l-150 34 z" fill="#cd2247" opacity="0.7"/>
    <path d="M1180 600 l170 -38 v86 l-170 38 z" fill="#8151b8" opacity="0.6"/>
    <path d="M700 660 l120 -26 v62 l-120 26 z" fill="#f3f1ed" opacity="0.25"/>
  </g>

  <rect width="1600" height="900" fill="#1a0d27" opacity="0.28"/>
</svg>
